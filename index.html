    <script>
      // Theme vor dem ersten Paint setzen (kein Flackern).
      try {
        var p = localStorage.getItem('pips-paws-theme');
        var dark = p === 'dark'
          || ((!p || p === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* privater Modus */ }
    </script>

    <noscript>
      <h1>Pips &amp; Paws — a character sheet and GM dashboard for Mausritter</h1>
      <p>
        Pips &amp; Paws is a free, open-source tool for the tabletop role-playing game
        <strong>Mausritter</strong>. It runs entirely in your browser: build a mouse adventurer
        following the official rules, track hit protection, pips, XP and grit, manage a
        drag-and-drop paw/body/pack inventory, and roll saves. A serverless real-time multiplayer
        mode lets a Game Master open a room and see every player's sheet live on a GM dashboard —
        no account, no server, just a room code or invite link. Available in English and German.
      </p>
      <p>This application needs JavaScript enabled. Source code and documentation:
        <a href="https://github.com/DonDavis-vibe/pips-and-paws">github.com/DonDavis-vibe/pips-and-paws</a>.
