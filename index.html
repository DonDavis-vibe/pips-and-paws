    <script>
      // Theme vor dem ersten Paint setzen (kein Flackern).
      try {
        var p = localStorage.getItem('pips-paws-theme');
        var dark = p === 'dark'
          || ((!p || p === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* privater Modus */ }
      // Gestaltung (Druckbogen = Standard, 'classic' = frueheres Design).
      try {
        var s = localStorage.getItem('pips-paws-skin');
        document.documentElement.setAttribute('data-skin', s === 'classic' ? 'classic' : 'print');
      } catch (e) { document.documentElement.setAttribute('data-skin', 'print'); }
    </script>

    <!-- Tusche-Filter fuer den Druckbogen-Look: Linien und Kanten bekommen
         eine leichte, handgezeichnete Unruhe. Nur per CSS referenziert.
         WebKit/Safari faellt bei feTurbulence+feDisplacementMap manchmal auf
         den ersten Frame rein: das gefilterte Element bleibt unsichtbar oder
         falsch plaziert, bis ein Resize eine neue Compositing-Ebene erzwingt.
         Jede filter:url(#ink-...)-Regel in print.css traegt deshalb ein
         begleitendes transform:translateZ(0), das die Ebene schon beim ersten
         Paint anlegt. -->

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <defs>
        <filter id="ink-line" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="1.4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="ink-edge" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="2" seed="3" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.6" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="ink-edge-2" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="11" result="n" />
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>

    <noscript>
      <h1>Pips &amp; Paws — a character sheet and GM dashboard for Mausritter</h1>
      <p lang="en">
        Pips &amp; Paws is a free, open-source tool for the tabletop role-playing game
        <strong>Mausritter</strong>. It runs entirely in your browser: build a mouse adventurer
        following the official rules, track hit protection, pips, XP and grit, manage a
        drag-and-drop paw/body/pack inventory, and roll saves. A serverless real-time multiplayer
        mode lets a Game Master open a room and see every player's sheet live on a GM dashboard —
        no account, no server, just a room code or invite link. Available in English, German,
        French, Italian and Japanese.
      </p>

        Pips &amp; Paws ist ein kostenloses Open-Source-Werkzeug für das Pen-&amp;-Paper-Rollenspiel

        Echtzeit-Multiplayer, alles im Browser und ohne Anmeldung.
